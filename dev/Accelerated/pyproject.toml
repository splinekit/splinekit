# splinekit/pyproject.toml

# Build
[build-system]
requires = [
    "scikit-build-core>=0.10", # Activate for C dynamic library
]
build-backend = "scikit_build_core.build" # Activate for C dynamic library

# Project
[project]
name = "splinekit"
version = "0.2.9"
dependencies = [
    "numpy >=1.26",
    "scipy >=1.15",
    "sympy >=1.12",
    "matplotlib >=3.8"
]
requires-python = ">=3.11"
authors = [
  { name="Philippe Thévenaz", email="philippe.thevenaz@icloud.com" },
]
maintainers = [
  { name="Philippe Thévenaz", email="philippe.thevenaz@icloud.com" },
]
description = "A set of functions and classes to handle periodic 1D polynomial splines"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

# URLs
[project.urls]
Homepage = "https://github.com/splinekit/splinekit"
Documentation = "https://splinekit.github.io/"
Repository = "https://github.com/splinekit/splinekit.git"
Issues = "https://github.com/splinekit/splinekit/issues"
Source = "https://github.com/splinekit/splinekit"
PyPI = "https://pypi.org/project/splinekit/"

# Optional dependencies
[project.optional-dependencies]
visualization = [
    "IPython >= 8.26"
]
docs = [
    "splinekit[visualization]",
    "sphinx >=7.3",
    "sphinx-gallery >=0.17",
    "sphinx-prompt >=1.8",
    "sphinx-copybutton >=0.5",
    "sphinx-remove-toctrees >=1.0",
    "sphinx-design >=0.6",
    "sphinx-rtd-theme >=3.0.2",
    "myst-parser >=3.0",
    "nbsphinx >=0.9"
]
tests = [
    "tox >=4.13",
    "pytest >=6.0"
]
dev = [
    "splinekit[visualization,tests]",
    "mypy >=1.8",
    "ipykernel >=7.1.0",
    "ipywidgets >=8",
    "build" # local wheel/source builds: python -m build
]

# pytest defaults (so `pytest -q` works everywhere)
[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
log_cli_level = "info"
testpaths = ["tests"]

# Scikit-build-core configuration
[tool.scikit-build]
wheel.packages = ["src/splinekit"]
editable.mode = "redirect"
sdist.include = [
    "src/splinekit/**",
    "splinekit/ansi_c/**", # Activate for C dynamic library
    "splinekit/CMakeLists.txt", # Activate for C dynamic library
    "README.md",
    "LICENSE"
]
cmake.build-type = "Release" # Activate for C dynamic library
